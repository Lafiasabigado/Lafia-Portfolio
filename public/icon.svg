<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.35)"/>
    </linearGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Squircle backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  
  <!-- Subtle ambient glow in bottom-right corner -->
  <circle cx="44" cy="44" r="14" fill="url(#dot-glow)"/>
  
  <!-- Modern Geometric 'L' -->
  <path d="M22 17 V45 H37" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Signature Blue Dot '.' -->
  <circle cx="44" cy="44" r="3.75" fill="#3B82F6"/>
  <circle cx="44" cy="44" r="1.5" fill="#93C5FD"/>
</svg>
